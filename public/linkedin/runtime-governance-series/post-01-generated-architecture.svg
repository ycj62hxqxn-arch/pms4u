<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#06B6D4"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <text x="90" y="95" fill="#E2E8F0" font-size="42" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700">
    Building Runtime Governance for AI — Part 1
  </text>
  <text x="90" y="140" fill="#67E8F9" font-size="24" font-family="Inter,Segoe UI,Arial,sans-serif">
    Why this project exists
  </text>

  <g filter="url(#glow)">
    <rect x="90" y="250" rx="18" width="250" height="120" fill="#0B1222" stroke="url(#accent)" stroke-width="2"/>
    <text x="215" y="318" text-anchor="middle" fill="#E2E8F0" font-size="30" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="600">Human</text>

    <rect x="400" y="250" rx="18" width="300" height="120" fill="#0B1222" stroke="url(#accent)" stroke-width="2"/>
    <text x="550" y="305" text-anchor="middle" fill="#E2E8F0" font-size="30" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="600">Authority</text>
    <text x="550" y="338" text-anchor="middle" fill="#94A3B8" font-size="18" font-family="Inter,Segoe UI,Arial,sans-serif">Who is allowed now?</text>

    <rect x="770" y="250" rx="18" width="320" height="120" fill="#0B1222" stroke="url(#accent)" stroke-width="2"/>
    <text x="930" y="305" text-anchor="middle" fill="#E2E8F0" font-size="30" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="600">Governance</text>
    <text x="930" y="338" text-anchor="middle" fill="#94A3B8" font-size="18" font-family="Inter,Segoe UI,Arial,sans-serif">Policy + Evidence + Admissibility</text>

    <rect x="1160" y="250" rx="18" width="170" height="120" fill="#0B1222" stroke="url(#accent)" stroke-width="2"/>
    <text x="1245" y="318" text-anchor="middle" fill="#E2E8F0" font-size="30" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="600">AI</text>

    <rect x="1380" y="250" rx="18" width="160" height="120" fill="#0B1222" stroke="url(#accent)" stroke-width="2"/>
    <text x="1460" y="305" text-anchor="middle" fill="#E2E8F0" font-size="28" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="600">Execution</text>
    <text x="1460" y="338" text-anchor="middle" fill="#94A3B8" font-size="16" font-family="Inter,Segoe UI,Arial,sans-serif">Consequence</text>
  </g>

  <g stroke="#22D3EE" stroke-width="3" stroke-linecap="round">
    <path d="M340 310H390"/>
    <path d="M700 310H760"/>
    <path d="M1090 310H1150"/>
    <path d="M1330 310H1370"/>
  </g>

  <g fill="#22D3EE">
    <polygon points="390,304 404,310 390,316"/>
    <polygon points="760,304 774,310 760,316"/>
    <polygon points="1150,304 1164,310 1150,316"/>
    <polygon points="1370,304 1384,310 1370,316"/>
  </g>

  <text x="90" y="515" fill="#E2E8F0" font-size="34" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="600">
    "Should this action happen now?"
  </text>
  <text x="90" y="560" fill="#94A3B8" font-size="24" font-family="Inter,Segoe UI,Arial,sans-serif">
    Runtime governance evaluates authority before consequence-bearing execution.
  </text>

  <text x="90" y="830" fill="#38BDF8" font-size="22" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="600">
    BPB Solutions LTD
  </text>
  <text x="1410" y="830" text-anchor="end" fill="#64748B" font-size="20" font-family="Inter,Segoe UI,Arial,sans-serif">
    bpbsolutionsltd.com
  </text>
</svg>
