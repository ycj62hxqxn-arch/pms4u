<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YAI Studio — Premium LinkedIn Graphic</title>
    <style>
      :root {
        --bg: #020304;
        --ink: #f4f7f8;
        --muted: #9aa6ad;
        --line: rgba(255, 255, 255, 0.14);
        --accent: #6ff3c0;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        background: #0b0d10;
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        display: grid;
        place-items: center;
      }

      .artboard {
        position: relative;
        width: 1080px;
        height: 1080px;
        overflow: hidden;
        background:
          radial-gradient(circle at 16% 16%, rgba(111, 243, 192, 0.14), transparent 34%),
          radial-gradient(circle at 84% 10%, rgba(116, 199, 255, 0.12), transparent 28%),
          linear-gradient(180deg, #08110f 0%, #030607 42%, #020304 100%);
        padding: 80px;
      }

      .artboard::before {
        content: "";
        position: absolute;
        inset: 36px;
        border: 1px solid var(--line);
        pointer-events: none;
      }

      .artboard::after {
        content: "";
        position: absolute;
        right: -190px;
        bottom: -190px;
        width: 560px;
        height: 560px;
        border: 1px solid rgba(111, 243, 192, 0.2);
        transform: rotate(18deg);
      }

      .top {
        position: relative;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: var(--accent);
        font-size: 28px;
        font-weight: 760;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .dot {
        width: 10px;
        height: 10px;
        background: var(--accent);
        border-radius: 50%;
      }

      .url {
        color: rgba(255, 255, 255, 0.72);
        font-size: 20px;
        letter-spacing: 0.08em;
      }

      .content {
        position: relative;
        z-index: 2;
        margin-top: 180px;
        max-width: 840px;
        display: grid;
        gap: 26px;
      }

      h1 {
        margin: 0;
        font-size: 114px;
        line-height: 0.92;
        letter-spacing: -0.03em;
        font-weight: 820;
      }

      .subtitle {
        margin: 0;
        color: var(--ink);
        font-size: 46px;
        font-weight: 680;
        line-height: 1.08;
      }

      .tag {
        display: inline-flex;
        width: fit-content;
        border: 1px solid rgba(111, 243, 192, 0.36);
        background: rgba(111, 243, 192, 0.1);
        color: var(--accent);
        padding: 14px 20px;
        font-size: 20px;
        font-weight: 760;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .stack {
        margin-top: 6px;
        color: var(--muted);
        font-size: 29px;
        line-height: 1.2;
      }

      .footer {
        position: absolute;
        left: 80px;
        right: 80px;
        bottom: 72px;
        z-index: 2;
        display: flex;
        justify-content: space-between;
        border-top: 1px solid var(--line);
        padding-top: 22px;
        color: rgba(255, 255, 255, 0.66);
        font-size: 20px;
        letter-spacing: 0.05em;
      }

      .footer span:last-child { color: var(--accent); }

      .back-btn {
        position: fixed;
        top: 16px;
        left: 16px;
        z-index: 1000;
        border: 1px solid var(--line);
        background: rgba(3, 6, 7, 0.9);
        color: var(--ink);
        border-radius: 999px;
        padding: 10px 14px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
      }

      .back-btn:hover {
        border-color: var(--accent);
        color: var(--accent);
      }

      @media screen and (max-width: 1100px) {
        body { align-items: start; justify-items: start; overflow: auto; }
      }
    </style>
  </head>
  <body>
    <button class="back-btn" onclick="goBack()" aria-label="Go back">← Back</button>
    <section class="artboard">
      <div class="top">
        <div class="brand"><span class="dot"></span>YAI Studio</div>
        <div class="url">studio.bpbsolutionsltd.com</div>
      </div>

      <div class="content">
        <h1>YAI<br />Studio</h1>
        <p class="subtitle">Runtime Governance for AI Execution</p>
        <span class="tag">Authority Before Execution</span>
        <p class="stack">AI Video • Images • Voice • Marketing • Agents</p>
      </div>

      <div class="footer">
        <span>Built with YAI Studio</span>
        <span>studio.bpbsolutionsltd.com</span>
      </div>
    </section>

    <script>
      function goBack() {
        if (window.history.length > 1) {
          window.history.back();
          return;
        }
        window.location.href = "https://bpbsolutionsltd.com/bpbsolutionsltd";
      }
    </script>
  </body>
</html>
