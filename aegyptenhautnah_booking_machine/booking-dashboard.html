<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ägypten Hautnah | Booking Operations Dashboard</title>
  <style>
    :root { --ink:#172033; --muted:#65748b; --line:#d8dee9; --bg:#f3f6fa; --panel:#fff; --blue:#0f5f87; --green:#137a4f; --amber:#a66313; --red:#b42318; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font-family:Arial, Helvetica, sans-serif; }
    .wrap { max-width:1220px; margin:0 auto; padding:24px 16px 50px; }
    header { display:flex; justify-content:space-between; align-items:end; gap:18px; flex-wrap:wrap; padding:18px 0; }
    h1 { margin:0; font-size:clamp(30px,5vw,54px); letter-spacing:-.04em; }
    p { color:var(--muted); line-height:1.55; }
    .btn, button { border:0; border-radius:6px; background:var(--blue); color:white; padding:10px 12px; font-weight:800; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; }
    .btn.secondary, button.secondary { background:white; color:var(--blue); border:1px solid rgba(15,95,135,.3); }
    .cards { display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:10px; margin:18px 0; }
    .card, .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; box-shadow:0 10px 28px rgba(23,32,51,.06); }
    .card { padding:13px; }
    .card span { display:block; color:var(--muted); font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; }
    .card strong { display:block; margin-top:5px; font-size:24px; }
    .panel { padding:16px; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th,td { border-bottom:1px solid var(--line); padding:10px; text-align:left; vertical-align:top; }
    th { color:#334155; background:#eaf0f7; font-size:11px; letter-spacing:.08em; text-transform:uppercase; }
    tr:last-child td { border-bottom:0; }
    .status { display:inline-flex; padding:4px 7px; border-radius:999px; background:#e0f2fe; color:#075985; font-weight:800; font-size:11px; }
    .status.done { background:#dcfce7; color:#166534; }
    .status.warn { background:#fef3c7; color:#92400e; }
    .status.cancel { background:#fee2e2; color:#991b1b; }
    .actions { display:flex; flex-wrap:wrap; gap:6px; }
    .mini { padding:7px 8px; font-size:11px; }
    .message { min-height:22px; font-weight:800; color:var(--green); }
    .error { color:var(--red); }
    pre { white-space:pre-wrap; background:#0f172a; color:#dbeafe; border-radius:8px; padding:12px; max-height:280px; overflow:auto; }
    .layout { display:grid; grid-template-columns:1fr 360px; gap:14px; align-items:start; }
    @media(max-width:980px){ .cards{grid-template-columns:repeat(2,1fr)} .layout{grid-template-columns:1fr} }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div>
        <h1>Booking Operations</h1>
        <p>Tour requests, governed status transitions, WhatsApp confirmations and replayable booking lineage.</p>
      </div>
      <div class="actions">
        <a class="btn secondary" href="booking-machine.de.html">Public Booking Page</a>
        <button onclick="loadAll()">Refresh</button>
      </div>
    </header>

    <div id="summary" class="cards"></div>
    <div id="message" class="message"></div>

    <div class="layout">
      <section class="panel">
        <table>
          <thead>
            <tr>
              <th>Booking</th>
              <th>Customer</th>
              <th>Tour</th>
              <th>Date / Pickup</th>
              <th>Status</th>
              <th>Operations</th>
            </tr>
          </thead>
          <tbody id="bookingRows"></tbody>
        </table>
      </section>

      <aside class="panel">
        <h2>Replay / WhatsApp</h2>
        <p>Select replay or WhatsApp from a booking row.</p>
        <pre id="sidePanel">No booking selected.</pre>
      </aside>
    </div>
  </main>

  <script>
    const API_BASE = localStorage.getItem('AH_API_BASE') || 'https://api.aegyptenhautnah.com/index.php';
    let bookings = [];

    function statusClass(status) {
      if (['TOUR_COMPLETED', 'REVIEW_REQUESTED'].includes(status)) return 'done';
      if (['CANCELLED'].includes(status)) return 'cancel';
      if (['NEW_REQUEST', 'OPERATOR_CONFIRMED', 'CUSTOMER_CONFIRMED'].includes(status)) return 'warn';
      return '';
    }

    function nextActions(status) {
      const map = {
        NEW_REQUEST: ['OPERATOR_CONFIRMED', 'CANCELLED'],
        OPERATOR_CONFIRMED: ['CUSTOMER_CONFIRMED', 'CANCELLED'],
        CUSTOMER_CONFIRMED: ['DEPOSIT_PAID', 'TOUR_SCHEDULED', 'CANCELLED'],
        DEPOSIT_PAID: ['TOUR_SCHEDULED', 'CANCELLED'],
        TOUR_SCHEDULED: ['TOUR_COMPLETED', 'CANCELLED'],
        TOUR_COMPLETED: ['REVIEW_REQUESTED'],
      };
      return map[status] || [];
    }

    async function api(path, options) {
      const res = await fetch(`${API_BASE}${path}`, options);
      if (!res.ok) throw new Error(await res.text());
      return res.json();
    }

    function renderSummary(s) {
      const cards = [
        ['Total', s.total_bookings],
        ['New', s.new_requests],
        ['Confirmed', s.confirmed],
        ['Scheduled', s.scheduled],
        ['Completed', s.completed],
        ['Deposit paid', s.deposit_paid],
      ];
      document.getElementById('summary').innerHTML = cards.map(([label, value]) => `
        <div class="card"><span>${label}</span><strong>${value}</strong></div>
      `).join('');
    }

    function whatsAppText(b) {
      return [
        `Hallo ${b.customer_name},`,
        ``,
        `vielen Dank fuer Ihre Anfrage bei Aegypten Hautnah.`,
        `Tour: ${b.tour_title}`,
        `Datum: ${b.tour_date}`,
        `Personen: ${b.adults} Erwachsene, ${b.children} Kinder`,
        `Abholung: ${b.hotel_or_pickup}`,
        b.pickup_time ? `Abholzeit: ${b.pickup_time}` : `Abholzeit: wird bestaetigt`,
        ``,
        `Status: ${b.status}`,
        `Booking ID: ${b.booking_id}`,
        ``,
        `Wir bestaetigen die Details persoenlich.`
      ].join('\n');
    }

    function renderBookings() {
      document.getElementById('bookingRows').innerHTML = bookings.map(b => `
        <tr>
          <td><strong>${b.booking_id.slice(0,8)}</strong><br><small>${new Date(b.created_at).toLocaleString('de-DE')}</small></td>
          <td>${b.customer_name}<br><small>${b.whatsapp}${b.email ? '<br>' + b.email : ''}</small></td>
          <td>${b.tour_title}<br><small>${b.adults} adults / ${b.children} children</small></td>
          <td>${b.tour_date}<br><small>${b.hotel_or_pickup}${b.pickup_time ? '<br>Pickup ' + b.pickup_time : ''}</small></td>
          <td><span class="status ${statusClass(b.status)}">${b.status}</span><br><small>${b.deposit_status}</small></td>
          <td>
            <div class="actions">
              ${nextActions(b.status).map(s => `<button class="mini" onclick="transitionBooking('${b.booking_id}','${s}')">${s}</button>`).join('')}
              <button class="mini secondary" onclick="showReplay('${b.booking_id}')">Replay</button>
              <button class="mini secondary" onclick="showWhatsApp('${b.booking_id}')">WhatsApp</button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    async function loadAll() {
      const message = document.getElementById('message');
      message.className = 'message';
      message.textContent = 'Loading...';
      try {
        const [summary, list] = await Promise.all([
          api('/admin/summary'),
          api('/bookings'),
        ]);
        bookings = list;
        renderSummary(summary);
        renderBookings();
        message.textContent = `Loaded ${bookings.length} bookings.`;
      } catch (err) {
        message.className = 'message error';
        message.textContent = `API error: ${err.message}`;
      }
    }

    async function transitionBooking(id, toStatus) {
      const note = prompt(`Note for ${toStatus}`, '');
      const assigned_operator = toStatus === 'OPERATOR_CONFIRMED' ? prompt('Operator / guide name', 'Local Operator') : undefined;
      const pickup_time = toStatus === 'TOUR_SCHEDULED' ? prompt('Pickup time', '08:00') : undefined;
      const deposit_status = toStatus === 'DEPOSIT_PAID' ? 'PAID' : undefined;
      try {
        await api(`/bookings/${id}/transition`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            to_status: toStatus,
            actor: 'admin-dashboard',
            note,
            assigned_operator,
            pickup_time,
            deposit_status,
          }),
        });
        await loadAll();
      } catch (err) {
        alert(err.message);
      }
    }

    async function showReplay(id) {
      try {
        const replay = await api(`/bookings/${id}/replay`);
        document.getElementById('sidePanel').textContent = JSON.stringify(replay, null, 2);
      } catch (err) {
        document.getElementById('sidePanel').textContent = err.message;
      }
    }

    function showWhatsApp(id) {
      const booking = bookings.find(b => b.booking_id === id);
      if (!booking) return;
      const text = whatsAppText(booking);
      const cleanNumber = booking.whatsapp.replace(/[^\d]/g, '');
      const link = cleanNumber ? `https://wa.me/${cleanNumber}?text=${encodeURIComponent(text)}` : '';
      document.getElementById('sidePanel').textContent = `${text}\n\n${link}`;
      if (link) window.open(link, '_blank');
    }

    loadAll();
    setInterval(loadAll, 15000);
  </script>
</body>
</html>
