<h2>Leads Dashboard</h2>
<div id="leads"></div>

<script>

db.collection("leads").orderBy("created","desc")
.onSnapshot(snapshot=>{

let html="";

snapshot.forEach(doc=>{
let l = doc.data();

html += `
<div style="border:1px solid #333;padding:10px;margin:10px">
<b>${l.name}</b><br>
${l.trip} | ${l.budget}$<br>
${l.wishes}
</div>
`;
});

document.getElementById("leads").innerHTML = html;

});

</script>
